					function renderDate(){
					var mydate = new Date();
					var year = mydate.getYear();
					if (year < 2000) {
					if (document.all)
					year = "19" + year;
					else
					year += 1900;
					}
					var day = mydate.getDay();
					var month = mydate.getMonth();
					var daym = mydate.getDate();
					if (daym < 10)
					daym = "0" + daym;
					var hours = mydate.getHours();
					var minutes = mydate.getMinutes();
					var seconds = mydate.getSeconds();
					var dn = "WIB";
					if (hours >= 24) {
					dn = "WIB";
					hours = hours - 12;
					}
					if (hours == 0)
					hours = 0;
					if (hours <= 9)
					hours = "0" + hours;
					if (minutes <= 9)
					minutes = "0" + minutes;
					if (seconds <= 9)
					seconds = "0" + seconds;
					document.getElementById("jam").innerHTML = " "+"<b>"+hours+":"+minutes+":"+seconds+"</b> "+dn;setTimeout("renderDate()",1000)
					}
					</script>
