<!DOCTYPE HTML>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Digital Information - Leaderboard IPK</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- CSS External bawaan template -->
    <link rel="stylesheet" href="css/animate.css">
    <link rel="stylesheet" href="css/icomoon.css">
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/modernizr-2.6.2.min.js"></script>

    <!-- Style Tambahan untuk Tampilan Modern -->
    <style>
        .leaderboard-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            padding: 25px;
            margin-bottom: 30px;
        }

        /* Top 3 Podium Cards */
        .top-rank-container {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .top-card {
            flex: 1;
            min-width: 220px;
            border-radius: 10px;
            padding: 15px;
            color: #fff;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .rank-1 { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); }
        .rank-2 { background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); }
        .rank-3 { background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%); }
        .top-card .badge-rank {
            font-size: 24px;
            font-weight: bold;
            background: rgba(255,255,255,0.3);
            width: 40px;
            height: 40px;
            line-height: 40px;
            border-radius: 50%;
            margin: 0 auto 10px;
        }
        .top-card h4 { color: #fff; margin: 5px 0; font-size: 16px; font-weight: bold; }
        .top-card p { margin: 0; font-size: 13px; opacity: 0.9; }
        .top-card .ipk-val { font-size: 22px; font-weight: bold; margin-top: 8px; }

        /* Filter & Sorting Controls */
        .control-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .control-bar input, .control-bar select {
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }
        .control-bar input { flex: 2; min-width: 200px; }
        .control-bar select { flex: 1; min-width: 160px; }

        /* Modern Table */
        .custom-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
        }
        .custom-table th {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 12px 15px;
            text-align: left;
            border: none;
        }
        .custom-table th:first-child { border-radius: 6px 0 0 6px; }
        .custom-table th:last-child { border-radius: 0 6px 6px 0; }

        .custom-table tbody tr {
            background-color: #f9f9f9;
            transition: all 0.2s ease;
        }
        .custom-table tbody tr:hover {
            background-color: #f0f4f8;
            transform: translateY(-2px);
        }
        .custom-table td {
            padding: 12px 15px;
            border: none;
            border-top: 1px solid #eef0f2;
            border-bottom: 1px solid #eef0f2;
        }
        .custom-table td:first-child { border-left: 1px solid #eef0f2; border-radius: 6px 0 0 6px; font-weight: bold; }
        .custom-table td:last-child { border-right: 1px solid #eef0f2; border-radius: 0 6px 6px 0; }

        .badge-ipk {
            background-color: #27ae60;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="fh5co-loader"></div>

    <div id="page">
        <!-- Navbar Header -->
        <nav class="fh5co-nav" role="navigation">
            <div class="container">
                <div class="fh5co-top-logo">
                    <div id="fh5co-text">
                        <div id="jam" style="padding:5px;width:auto;"></div>
                    </div>
                </div>
                <div class="fh5co-top-menu menu-1 text-center">
                    <ul>
                        <li><b>IPK LEADERBOARD</b></li>
                    </ul>
                </div>
                <div class="fh5co-top-social menu-1 text-right">
                    <ul class="fh5co-social">
                        <li><a href="3-akademik.html"><font size='3'>KEMBALI</font> <b><font color='red'>[X]</font></b></a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="container" style="margin-top: 30px;">
            <div class="row">
                <div class="col-md-10 col-md-offset-1">
                    <div class="leaderboard-card animate-box">
                        <h3 style="text-align: center; margin-bottom: 5px; font-weight: bold;">TOP 30 MAHASISWA</h3>
                        <p style="text-align: center; color: #666; margin-bottom: 25px;">Dengan IPK Terbaik di Semester Genap 2025/2026</p>

                        <!-- Podia Top 3 Highlight -->
                        <div class="top-rank-container" id="podium-container"></div>

                        <!-- Bar Filter & Sortir -->
                        <div class="control-bar">
                            <input type="text" id="search-input" placeholder="Cari Nama Mahasiswa..." oninput="filterData()">

                            <select id="prodi-filter" onchange="filterData()">
                                <option value="">Semua Program Studi</option>
                                <option value="Manajemen Informatika">Manajemen Informatika</option>
                                <option value="Komputerisasi Akuntansi">Komputerisasi Akuntansi</option>
                                <option value="Administrasi Bisnis Internasional">Administrasi Bisnis Internasional</option>
                                <option value="Administrasi Bisnis">Administrasi Bisnis</option>
                            </select>

                            <select id="sort-order" onchange="filterData()">
                                <option value="ipk-desc">IPK (Tertinggi ke Terendah)</option>
                                <option value="ipk-asc">IPK (Terendah ke Tertinggi)</option>
                                <option value="name-asc">Nama (A - Z)</option>
                            </select>
                        </div>

                        <!-- Tabel Utama -->
                        <div class="table-responsive">
                            <table class="custom-table">
                                <thead>
                                    <tr>
                                        <th>POSISI</th>
                                        <th>NAMA MAHASISWA</th>
                                        <th>PROGRAM STUDI</th>
                                        <th>SEMESTER</th>
                                        <th>IPK</th>
                                    </tr>
                                </thead>
                                <tbody id="student-table-body">
                                    <!-- Baris data diisi oleh JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Jam Digital Bawaan -->
    <script type="text/javascript">
        window.setTimeout("renderDate()",1);
        function renderDate(){
            var mydate = new Date();
            var hours = mydate.getHours();
            var minutes = mydate.getMinutes();
            var seconds = mydate.getSeconds();
            var dn = "WIB";
            if (hours <= 9) hours = "0" + hours;
            if (minutes <= 9) minutes = "0" + minutes;
            if (seconds <= 9) seconds = "0" + seconds;
            document.getElementById("jam").innerHTML = "<b>"+hours+":"+minutes+":"+seconds+"</b> "+dn;
            setTimeout("renderDate()",1000);
        }
    </script>

  <!-- Library JS Bawaan Template -->
<script src="js/jquery.min.js"></script>
<script src="js/jquery.easing.1.3.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/jquery.waypoints.min.js"></script>
<script src="js/main.js"></script>

<!-- File Data IPK -->
<script src="js/data_ipk.js"></script>

    <!-- 2. SCRIPT TAMPILAN & INTERAKSI -->
    <script>
        function renderPodium(top3) {
            const container = document.getElementById("podium-container");
            if (!top3 || top3.length < 3) {
                container.style.display = "none";
                return;
            }
            container.style.display = "flex";
            container.innerHTML = `
                <div class="top-card rank-1">
                    <div class="badge-rank">🥇</div>
                    <h4>${top3[0].nama}</h4>
                    <p>${top3[0].prodi}</p>
                    <div class="ipk-val">${top3[0].ipk.toFixed(2)}</div>
                </div>
                <div class="top-card rank-2">
                    <div class="badge-rank">🥈</div>
                    <h4>${top3[1].nama}</h4>
                    <p>${top3[1].prodi}</p>
                    <div class="ipk-val">${top3[1].ipk.toFixed(2)}</div>
                </div>
                <div class="top-card rank-3">
                    <div class="badge-rank">🥉</div>
                    <h4>${top3[2].nama}</h4>
                    <p>${top3[2].prodi}</p>
                    <div class="ipk-val">${top3[2].ipk.toFixed(2)}</div>
                </div>
            `;
        }

        function renderTable(data) {
            const tbody = document.getElementById("student-table-body");
            tbody.innerHTML = "";

            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 20px;">Data tidak ditemukan</td></tr>`;
                return;
            }

            data.forEach((item, index) => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>#${index + 1}</td>
                    <td><strong>${item.nama}</strong></td>
                    <td>${item.prodi}</td>
                    <td>Semester ${item.semester}</td>
                    <td><span class="badge-ipk">${item.ipk.toFixed(2)}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterData() {
            const searchVal = document.getElementById("search-input").value.toLowerCase();
            const prodiVal = document.getElementById("prodi-filter").value;
            const sortVal = document.getElementById("sort-order").value;

            let filtered = studentsData.filter(s => {
                const matchesName = s.nama.toLowerCase().includes(searchVal);
                const matchesProdi = prodiVal === "" || s.prodi === prodiVal;
                return matchesName && matchesProdi;
            });

            if (sortVal === "ipk-desc") {
                filtered.sort((a, b) => b.ipk - a.ipk);
            } else if (sortVal === "ipk-asc") {
                filtered.sort((a, b) => a.ipk - b.ipk);
            } else if (sortVal === "name-asc") {
                filtered.sort((a, b) => a.nama.localeCompare(b.nama));
            }

            renderTable(filtered);
        }

        // Render awal saat pertama kali dibuka
        renderPodium(studentsData.slice(0, 3));
        renderTable(studentsData);
    </script>
</body>
</html>
